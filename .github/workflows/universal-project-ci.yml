name: Universal Musical Project Engine

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/universal-project-ci.yml"
  push:
    branches:
      - feature/dawproject-universal-reconstruction

permissions:
  contents: read

jobs:
  project-engine:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with offline native FLP backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,native-flp]"

      - name: Static lint
        run: python -m ruff check src tests

      - name: Full test suite (including source-to-native-FLP)
        run: python -m pytest -q

      - name: Verify new native backend formatting
        shell: bash
        run: |
          python -m ruff format --check \
            src/fl_studio_mcp/utils/native_flp_meter.py \
            src/fl_studio_mcp/utils/native_flp_audit.py \
            src/fl_studio_mcp/utils/native_flp_template.py \
            tests/test_native_flp_template.py
